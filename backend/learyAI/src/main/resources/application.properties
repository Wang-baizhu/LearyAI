# 当前文件职责：提供后端默认运行配置，敏感项统一通过环境变量注入。
spring.application.name=learyAI
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:false}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=learyAI
cors.allowed-origin-patterns=http://localhost:8000,http://localhost:3000,http://localhost:3030,http://127.0.0.1:3000,http://127.0.0.1:3030,http://192.168.31.160:8000,http://localhost,capacitor://localhost
spring.datasource.url=jdbc:postgresql://localhost:5432/learyai_test
spring.datasource.username=postgres
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.sql.init.mode=always
spring.sql.init.separator=@@
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=20MB

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.data.redis.timeout=5s

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:}
spring.rabbitmq.virtual-host=bthost

auth.session.ttl-seconds=86400
auth.session.remember-me-ttl-seconds=604800
auth.session.renew-threshold-seconds=1800
auth.session.test-bypass-enabled=true
auth.session.test-bypass-session-id=test
auth.session.test-bypass-user-id=1
auth.login.max-failures=5
auth.login.lock-minutes=15
auth.cookie.name=sessionId
auth.cookie.same-site=Lax
auth.token.ttl-seconds=1800
# token 刷新阈值，临近过期时前端可发起刷新请求
auth.token.refresh-threshold-seconds=30
auth.token.test-bypass-enabled=true
auth.token.test-bypass-token-value=test-token
auth.token.test-bypass-user-id=1
auth.token.test-bypass-session-id=test
auth.internal.enabled=true
auth.internal.header-name=X-Internal-Token
auth.internal.token=${AUTH_INTERNAL_TOKEN:}
auth.internal.source-header-name=X-Internal-Source
auth.internal.source-whitelist=local-dev,leary-agent,leary-task
auth.sms.code-length=6
auth.sms.code-ttl-seconds=300
auth.sms.resend-interval-seconds=60
auth.sms.limit-window-seconds=600
auth.sms.max-per-window=3
auth.sms.aliyun.access-key-id=${AUTH_SMS_ALIYUN_ACCESS_KEY_ID:}
auth.sms.aliyun.access-key-secret=${AUTH_SMS_ALIYUN_ACCESS_KEY_SECRET:}
auth.sms.aliyun.template-code=100001
auth.sms.aliyun.region=cn-shenzhen
auth.sms.aliyun.endpoint=dypnsapi.aliyuncs.com

kb.storage.provider=minio
kb.storage.minio.endpoint=http://192.168.31.160:9000
kb.storage.minio.bucket=learyai
kb.storage.minio.access-key=${KB_STORAGE_MINIO_ACCESS_KEY:}
kb.storage.minio.secret-key=${KB_STORAGE_MINIO_SECRET_KEY:}
kb.storage.minio.presign-expire-seconds=3600
kb.storage.sts-expire-seconds=3600
kb.storage.minio.region=
kb.storage.minio.sts-role-arn=
kb.storage.minio.sts-role-session-name=kb-docs
kb.storage.minio.sts-external-id=

task.mq.exchange=task.exchange
task.mq.command.doc.routing-key=task.command.doc.process
task.mq.command.doc.queue=task.doc.process.queue
task.mq.command.doc.retry-routing-key=task.command.doc.process.retry
task.mq.command.doc.retry-queue=task.doc.process.retry.queue
task.mq.command.doc.retry-delay-ms=5000
task.mq.command.doc.max-retries=3
task.mq.command.doc.dlq=task.doc.process.dlq
task.mq.command.doc.dlq-routing-key=task.command.doc.process.dlq
task.mq.command.agent.routing-key=task.command.agent.run
task.mq.command.agent.queue=task.agent.run.queue
task.mq.command.agent.retry-routing-key=task.command.agent.run.retry
task.mq.command.agent.retry-queue=task.agent.run.retry.queue
task.mq.command.agent.retry-delay-ms=5000
task.mq.command.agent.max-retries=3
task.mq.command.agent.dlq=task.agent.run.dlq
task.mq.command.agent.dlq-routing-key=task.command.agent.run.dlq
task.mq.event.status.routing-key=task.event.status.changed
task.mq.event.status.queue=task.status.changed.queue
task.mq.event.status.retry-routing-key=task.event.status.changed.retry
task.mq.event.status.retry-queue=task.status.changed.retry.queue
task.mq.event.status.retry-delay-ms=5000
task.mq.event.status.max-retries=3
task.mq.event.status.dlq=task.status.changed.dlq
task.mq.event.status.dlq-routing-key=task.event.status.changed.dlq
task.retention.days=7
task.retention.cleanup-cron=0 30 3 * * ?
task.status-event.retention.days=8
task.status-event.retention.cleanup-cron=0 45 3 * * ?

# gRPC server configuration
usage.service.grpc.port=9091
usage.service.ak=${USAGE_SERVICE_AK:}
usage.idempotency.redis-ttl-seconds=300

# shared cache settings
cache.common.enabled=true
cache.common.jitter-percent=20
cache.common.null-ttl-seconds=20
cache.common.second-delete-enabled=true
cache.common.second-delete-delay-millis=300

# usage cache settings
cache.usage.snapshot-extra-ttl-seconds=3600

# auth cache settings
cache.auth.me-ttl-seconds=60
cache.auth.me-null-ttl-seconds=20

# authz cache settings
cache.authz.role-ttl-seconds=60
cache.authz.project-exists-ttl-seconds=120
cache.authz.role-null-ttl-seconds=20
cache.authz.project-exists-null-ttl-seconds=20

# template cache settings
cache.template.list-ttl-seconds=120
cache.template.facets-ttl-seconds=120
cache.template.detail-ttl-seconds=120
cache.template.data-ttl-seconds=60
cache.template.data-null-ttl-seconds=20

# kb cache settings
cache.kb.list-ttl-seconds=120
cache.kb.recent-ttl-seconds=60
cache.kb.detail-ttl-seconds=60

# kbdoc cache settings
cache.kbdoc.list-ttl-seconds=60
cache.kbdoc.options-ttl-seconds=60
cache.kbdoc.detail-ttl-seconds=60
cache.kbdoc.chunks-ttl-seconds=180
cache.kbdoc.recent-ttl-seconds=60
cache.kbdoc.preview-sts-ttl-seconds=3600

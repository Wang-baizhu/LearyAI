# 当前文件职责：为 Redis exporter 暴露 Prometheus 抓取端口。
apiVersion: v1
kind: Service
metadata:
  name: leary-redis-exporter
  namespace: observability
  labels:
    app: leary-redis-exporter
spec:
  selector:
    app: leary-redis-exporter
  ports:
    - name: metrics
      port: 9121
      targetPort: metrics

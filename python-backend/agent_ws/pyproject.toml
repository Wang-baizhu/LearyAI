[project]
name = "agent-ws"
version = "0.1.0"
description = "Agent websocket service package."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111,<1.0",
    "grpcio>=1.60,<2.0",
    "leary-logging",
    "kosong[contrib]==0.49.0",
    "prometheus-client>=0.20,<1.0",
    "protobuf>=5.26,<6.0",
    "pykaos==0.9.0",
    "redis>=7.1.0",
    "uvicorn>=0.30,<1.0",
    "kimi-cli",
    "usage-control",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_ws*"]
namespaces = true

[project]
name = "tasks-server"
version = "0.1.0"
description = "Background task consumer service package."
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.60,<2.0",
    "httpx[socks]==0.28.1",
    "jsonschema>=4.26,<5.0",
    "leary-logging",
    "kosong[contrib]==0.49.0",
    "pika==1.3.2",
    "pydantic>=2.12,<2.13",
    "prometheus-client>=0.20,<1.0",
    "protobuf>=5.26,<6.0",
    "pykaos==0.9.0",
    "kimi-cli",
    "task-events",
    "usage-control",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["tasks_server*"]
namespaces = true

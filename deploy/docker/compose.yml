# 当前文件职责：使用 Docker Compose 启动本地基础设施与后端服务，覆盖 postgres、redis、rabbitmq、backend、agent、task。
services:
  postgres:
    build:
      context: ../..
      dockerfile: deploy/pg/docker/dockerfile
    image: leary-pg:local
    container_name: leary-pg
    restart: unless-stopped
    env_file:
      - ./env/local/postgres.env
    ports:
      - "5432:5432"
    volumes:
      - ../pg/init:/docker-entrypoint-initdb.d:ro
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-learyai_test}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    container_name: leary-redis
    restart: unless-stopped
    env_file:
      - ./env/local/redis.env
    command:
      - /bin/sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD"
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" ping']
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-management
    container_name: leary-rabbitmq
    restart: unless-stopped
    env_file:
      - ./env/local/rabbitmq.env
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20

  backend:
    build:
      context: ../..
      dockerfile: backend/docker/dockerfile
    image: leary-backend:local
    container_name: leary-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file:
      - ./env/local/backend.env
    ports:
      - "8080:8080"
      - "9091:9091"

  agent:
    build:
      context: ../../python-backend
      dockerfile: docker/agentserver/dockerfile
    image: leary-agent:local
    container_name: leary-agent
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    env_file:
      - ./env/local/agent.env
    environment:
      KIMI_AGENT_WS_HOST: 0.0.0.0
      KIMI_AGENT_WS_PORT: 8081
      KIMI_RDB_WORK_DIR_BASE: /app/workdir/learyai
    ports:
      - "8081:8081"
    volumes:
      - ./data/agent/logs:/app/logs
      - ./data/agent/kimi-logs:/root/.kimi/logs
      - ./data/agent/workdir:/app/workdir

  task:
    build:
      context: ../..
      dockerfile: python-backend/docker/taskserver/dockerfile
    image: leary-task:local
    container_name: leary-task
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    env_file:
      - ./env/local/task.env
    environment:
      TASK_CWD: /app
      KIMI_TASK_CWD: /app
      TASK_METRICS_HOST: 0.0.0.0
      TASK_METRICS_PORT: 8023
      KIMI_RDB_WORK_DIR_BASE: /app/workdir/learyai
    ports:
      - "8023:8023"
    volumes:
      - ./data/task/logs:/app/logs
      - ./data/task/kimi-logs:/root/.kimi/logs
      - ./data/task/workdir:/app/workdir

  plugin-gateway:
    build:
      context: ../..
      dockerfile: deploy/docker/plugin-gateway/Dockerfile
    image: leary-plugin-gateway:local
    container_name: leary-plugin-gateway
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    environment:
      LEARY_BACKEND_INTERNAL_BASE_URL: http://backend:8080/api/templates/internal/plugins
      LEARY_PLUGIN_GATEWAY_RESOLVER: 127.0.0.11
    ports:
      - "7999:7999"

# 当前文件职责：固定 learyAI 所需的 kube-prometheus-stack values，包括 Alertmanager 基础路由。
prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelector:
      matchLabels:
        release: kps
    ruleSelector:
      matchLabels:
        release: kps

grafana:
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
    datasources:
      enabled: true
      label: grafana_datasource

alertmanager:
  enabled: true
  alertmanagerSpec:
    replicas: 1
  config:
    route:
      receiver: blackhole
      group_by:
        - alertname
        - severity
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: critical-default
          matchers:
            - severity="critical"
        - receiver: warning-default
          matchers:
            - severity="warning"
    receivers:
      - name: blackhole
      - name: critical-default
      - name: warning-default

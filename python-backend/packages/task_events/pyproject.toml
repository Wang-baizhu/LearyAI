# 该文件职责：定义 task-events 公共包的构建与运行时依赖。
[project]
name = "task-events"
version = "0.1.0"
description = "Shared task event outbox, publisher, and execution dedupe for python-backend services."
requires-python = ">=3.12"
dependencies = [
    "pika==1.3.2",
    "psycopg2-binary>=2.9,<3.0",
    "sqlalchemy>=2.0,<3.0",
]

[build-system]
requires = ["uv_build>=0.8.5,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "task_events"

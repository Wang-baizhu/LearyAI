# 当前文件职责：dev + external-kb 组合编排（使用外部 KB，镜像为 dev 本地联调策略）。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../external-kb
  - ../../components/env/develop

patches:
  - path: ../external-kb/patch-agent-configmap.yaml
  - path: ../external-kb/patch-taskserver-configmap.yaml
  - path: patch-plugin-gateway-deployment.yaml
  - path: patch-backend-deployment.yaml
  - path: patch-agent-deployment.yaml
  - path: patch-task-deployment.yaml

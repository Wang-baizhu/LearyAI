# 当前文件职责：为 RabbitMQ exporter 暴露 Prometheus 抓取端口。
apiVersion: v1
kind: Service
metadata:
  name: leary-rabbitmq-exporter
  namespace: observability
  labels:
    app: leary-rabbitmq-exporter
spec:
  selector:
    app: leary-rabbitmq-exporter
  ports:
    - name: metrics
      port: 9419
      targetPort: metrics

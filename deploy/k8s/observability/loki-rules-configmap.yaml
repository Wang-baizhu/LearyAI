# 当前文件职责：提供 Loki ruler 的基础日志告警规则。
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-rules
  namespace: observability
  labels:
    app: loki
data:
  learyai-rules.yaml: |
    groups:
      - name: learyai-log-rules
        interval: 1m
        rules:
          - alert: LearyAiErrorLogBurst
            expr: sum(count_over_time({namespace="learyai"} |~ "(?i)error|exception|traceback" [5m])) > 20
            for: 2m
            labels:
              severity: warning
              team: learyai
            annotations:
              summary: "learyai 命名空间 5 分钟错误日志突增"
              description: "5 分钟窗口内 error/exception/traceback 日志超过 20 条。"
          - alert: LearyAiTaskServerErrorBurst
            expr: sum(count_over_time({namespace="learyai",app="leary-task"} |~ "(?i)error|failed|timeout" [5m])) > 10
            for: 2m
            labels:
              severity: critical
              team: learyai
            annotations:
              summary: "tasks_server 错误日志突增"
              description: "5 分钟窗口内 leary-task 错误/失败/超时日志超过 10 条。"

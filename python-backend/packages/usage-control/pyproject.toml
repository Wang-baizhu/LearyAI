# 该文件职责：定义 usage-control 共享包的构建与运行时依赖。
[project]
name = "usage-control"
version = "0.1.0"
description = "Shared usage control client, billing, and chat-provider wrapper for python-backend services."
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "grpcio>=1.60,<2.0",
    "protobuf>=5.26,<7.0",
    "pydantic>=2.12,<2.13",
    "kosong",
]

[build-system]
requires = ["uv_build>=0.8.5,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "usage_control"

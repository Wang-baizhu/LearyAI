# 该文件用于定义 kimi-cli 包的构建与依赖
[project]
name = "kimi-cli"
version = "1.31.0"
description = "Kimi CLI core package."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agent-client-protocol==0.8.0",
    "asyncpg>=0.31.0",
    "aiofiles>=24.0,<26.0",
    "aiohttp==3.13.3",
    "fastmcp==2.12.5",
    "jinja2==3.1.6",
    "keyring>=25.7.0",
    "kosong[contrib]==0.49.0",
    "loguru>=0.6.0,<0.8",
    "leary-logging",
    "pydantic>=2.12,<2.13",
    "prometheus-client>=0.20,<1.0",
    "pykaos==0.9.0",
    "pyyaml>=6.0.2,<6.1",
    "streamingjson==0.0.5",
    "tenacity==9.1.2",
    "tomlkit==0.14.0",
    "typer==0.21.1",
    "trafilatura==2.0.0",
    "prompt-toolkit==3.0.52",
    "pillow==12.1.0",
    "ripgrepy==2.2.0",
    "rich==14.2.0",
    "lxml==6.0.2",
    "httpx[socks]==0.28.1",
    "batrachian-toad==0.5.23; python_version >= \"3.14\"",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "scalar-fastapi>=1.5.0",
    "websockets>=14.0",
    "setproctitle>=1.3.0",
]

[build-system]
requires = ["uv_build>=0.8.5,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "kimi_cli"

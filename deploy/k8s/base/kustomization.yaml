# 当前文件职责：声明 learyAI 在 K8s 的基础资源集合（backend/agent/taskserver + ingress，不区分 KB 内外部部署）。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: learyai

generatorOptions:
  disableNameSuffixHash: true

resources:
  - namespace.yaml
  - plugin-gateway-deployment.yaml
  - plugin-gateway-service.yaml
  - backend-deployment.yaml
  - backend-service.yaml
  - agent-deployment.yaml
  - agent-service.yaml
  - taskserver-deployment.yaml
  - taskserver-service.yaml
  - ingress.yaml

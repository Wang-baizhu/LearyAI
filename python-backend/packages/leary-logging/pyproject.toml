# 该文件职责：定义 leary-logging 包的构建与依赖。
[project]
name = "leary-logging"
version = "0.1.0"
description = "Shared logging setup for python-backend services."
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.6.0,<0.8",
]

[build-system]
requires = ["uv_build>=0.8.5,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "leary_logging"

# 当前文件职责：dev + internal-kb 组合编排（使用集群内 KB，镜像为 dev 本地联调策略）。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../internal-kb
  - ../../components/env/develop

patches:
  - path: ../internal-kb/patch-agent-configmap.yaml
  - path: ../internal-kb/patch-taskserver-configmap.yaml
  - path: patch-plugin-gateway-deployment.yaml
  - path: patch-backend-deployment.yaml
  - path: patch-agent-deployment.yaml
  - path: patch-task-deployment.yaml

# 当前文件职责：聚合 learyAI 在 K8s 内部自动创建的基础设施资源（PostgreSQL、Redis、RabbitMQ）及其初始化配置。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: learyai

generatorOptions:
  disableNameSuffixHash: true

resources:
  - namespace.yaml
  - postgres-service.yaml
  - postgres-statefulset.yaml
  - redis-service.yaml
  - redis-statefulset.yaml
  - rabbitmq-service.yaml
  - rabbitmq-statefulset.yaml

configMapGenerator:
  - name: leary-postgres-init
    files:
      - 01-init-pgvector.sql=init/01-init-pgvector.sql
      - 02-init-pg-jieba.sql=init/02-init-pg-jieba.sql

secretGenerator:
  - name: leary-postgres-secret
    envs:
      - secret.env
  - name: leary-redis-secret
    envs:
      - secret.env
  - name: leary-rabbitmq-secret
    envs:
      - secret.env
